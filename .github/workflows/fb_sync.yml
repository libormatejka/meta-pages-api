name: Facebook to BigQuery Daily Sync

on:
  schedule:
    # Spustí se každý den v 5:00 ráno UTC
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      backfill_days:
        description: 'Kolik dní zpět doplnit (1-730). Prázdné = běžný běh (3 dny).'
        required: false
        default: ''
      probe_metrics:
        description: 'Ověřit kandidátní Page Insights metriky místo synchronizace'
        required: false
        type: boolean
        default: false

jobs:
  sync_metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repozitáře
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Instalace závislostí
        run: pip install requests google-cloud-bigquery google-auth
        
      - name: Ověření Page Insights metrik
        if: github.event_name == 'workflow_dispatch' && inputs.probe_metrics
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
        run: python probe_page_metrics.py

      - name: Uložení CSV reportu metrik
        if: github.event_name == 'workflow_dispatch' && inputs.probe_metrics
        uses: actions/upload-artifact@v4
        with:
          name: page-metrics-probe
          path: page-metrics-probe.csv
          if-no-files-found: error

      - name: Spuštění synchronizace
        if: github.event_name != 'workflow_dispatch' || !inputs.probe_metrics
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
          BQ_DATASET: ${{ secrets.BQ_DATASET }}
          BACKFILL_DAYS: ${{ github.event.inputs.backfill_days }}
        run: python main.py